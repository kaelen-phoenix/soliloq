# La app de Yalope para Android y iPhone (#396): una sola base, `movil/` (Expo). Con la web son
# las tres versiones, siempre a la par (#402). Reemplazó a la app de Capacitor (#395) con el mismo
# identificador (`com.yalope.app`) y la misma clave de firma: se instala encima de aquella.
#
# En cada push a main arma el APK firmado y el AAB (para Google Play, cuando se publique) y el
# paquete para el simulador de iPhone (sin cuenta de Apple Developer todavía no se firma). Quedan en
# la release «apps-ultima». En los PR que tocan la app o lo que comparte con la web, compila para
# verificar.
name: Apps

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "movil/**"
      - "src/mensajes/**"
      - "src/lib/**"
      - "src/i18n/**"
      - ".github/workflows/apps.yml"
  workflow_dispatch:

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 1.0.${{ github.run_number }}
  EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: movil/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Configuración de Firebase (push, #389)
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_BASE64" ]; then
            echo "::warning::Sin GOOGLE_SERVICES_JSON_BASE64: la app sale sin notificaciones push."; exit 0
          fi
          echo "$GOOGLE_SERVICES_BASE64" | base64 -d > google-services.json
          echo "GOOGLE_SERVICES_FILE=./google-services.json" >> "$GITHUB_ENV"
      - run: npx expo prebuild --platform android --no-install
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Sin ANDROID_KEYSTORE_BASE64: el APK sale con la firma de depuración."; exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/yalope.p12"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/yalope.p12" >> "$GITHUB_ENV"
      - name: Compilar
        working-directory: movil/android
        env:
          ANDROID_KEYSTORE_CLAVE: ${{ secrets.ANDROID_KEYSTORE_CLAVE }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        # Solo los procesadores de teléfonos (ARM de 64 y 32 bits): con los de emulador (x86) el
        # APK pasaba los 120 MB. El AAB lleva todo: Google Play reparte a cada teléfono lo suyo.
        run: |
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          ./gradlew bundleRelease --no-daemon
      - name: Ordenar los paquetes
        run: |
          mkdir -p ../salida
          cp "$(ls android/app/build/outputs/apk/release/*.apk | head -1)" ../salida/Yalope.apk
          cp android/app/build/outputs/bundle/release/app-release.aab ../salida/Yalope.aab
          ls -la ../salida
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.VERSION_NAME }}
          path: salida/
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: movil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: movil/package-lock.json
      - run: npm ci
      - run: npx expo prebuild --platform ios
      - name: Compilar para el simulador
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          ESQUEMA=$(basename "$WS" .xcworkspace)
          xcodebuild \
            -workspace "$WS" \
            -scheme "$ESQUEMA" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build-ios \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Ordenar el paquete
        run: |
          mkdir -p ../salida
          APP=$(ls -d build-ios/Build/Products/Release-iphonesimulator/*.app | head -1)
          ditto -c -k --keepParent "$APP" ../salida/Yalope-iphone-simulador.zip
          ls -la ../salida
      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ env.VERSION_NAME }}
          path: salida/
          if-no-files-found: error

  google-play:
    # Sube el AAB a Google Play (#420). Queda apagado hasta que la app exista en Play Console,
    # tenga el primer AAB subido a mano y la cuenta de servicio esté invitada: entonces se
    # prende con la variable de repo `PLAY_ACTIVO=si`. El track (`PLAY_TRACK`, por defecto
    # `internal`) y el estado (`PLAY_ESTADO`: `draft` mientras la app no esté publicada, que es
    # lo único que Google acepta; después `completed`) también salen de variables.
    if: >-
      vars.PLAY_ACTIVO == 'si' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-${{ env.VERSION_NAME }}
          path: paquetes
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CUENTA_SERVICIO }}
          packageName: com.yalope.app
          releaseFiles: paquetes/Yalope.aab
          releaseName: ${{ env.VERSION_NAME }}
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_ESTADO || 'draft' }}

  publicar:
    # También al dispararlo a mano sobre main (si GitHub no arrancó la corrida del push). Con que
    # salga el de Android alcanza: a veces GitHub no consigue una Mac y el de iPhone no corre; en
    # ese caso queda el último que salió.
    if: >-
      always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' && needs.android.result == 'success'
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paquetes
          merge-multiple: true
      - name: Release «apps-ultima»
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NOTAS="Versión $VERSION_NAME · commit ${GITHUB_SHA::7} · $(date -u +'%Y-%m-%d %H:%M') UTC

          - **Yalope.apk**: Android. Se baja desde el teléfono y se instala (hay que permitir «instalar apps de origen desconocido»). Se instala encima de la versión anterior.
          - **Yalope.aab**: Android para Google Play (todavía no se publica).
          - **Yalope-iphone-simulador.zip**: iPhone, solo para el simulador de Xcode (sin firma de Apple todavía)."
          if ! gh release view apps-ultima >/dev/null 2>&1; then
            gh release create apps-ultima --prerelease --title "Apps · última versión" --notes "$NOTAS" --target "$GITHUB_SHA"
          else
            gh release edit apps-ultima --notes "$NOTAS"
          fi
          gh release upload apps-ultima paquetes/* --clobber
          # Lo de la etapa de convivencia con la app de Capacitor (#395) ya no va.
          for viejo in Yalope-nativa-previa.apk Yalope-nativa-previa-iphone-simulador.zip; do
            gh release delete-asset apps-ultima "$viejo" -y 2>/dev/null || true
          done
      - name: Resumen
        run: |
          {
            echo "### Las tres versiones"
            echo "- **Web**: yalope.com (Vercel)"
            echo "- **Android**: [Yalope.apk](https://github.com/${{ github.repository }}/releases/download/apps-ultima/Yalope.apk) · $VERSION_NAME"
            echo "- **iPhone (simulador)**: [Yalope-iphone-simulador.zip](https://github.com/${{ github.repository }}/releases/download/apps-ultima/Yalope-iphone-simulador.zip)"
          } >> "$GITHUB_STEP_SUMMARY"
