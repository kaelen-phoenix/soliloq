# Las apps de Android y iPhone. Tres versiones de Yalope: la web (Vercel, en cada push a main)
# y las apps, que salen en cada push a main de acá:
#   - app de Capacitor (#387): abre yalope.com; es la que se usa mientras dura la migración;
#   - app nativa (#396, `movil/`, Expo): vista previa (`com.yalope.app.previa`) hasta estar a la
#     par de la web (#395); se instala al lado de la otra.
# De cada una: APK firmado (y AAB) para Android, y el paquete para el simulador de iPhone (sin
# cuenta de Apple Developer todavía no se firma). Los de main quedan en la release «apps-ultima».
name: Apps

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "android/**"
      - "ios/**"
      - "app-nativa/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "movil/**"
      - "src/mensajes/**"
      - "src/lib/**"
      - "src/i18n/**"
      - ".github/workflows/apps.yml"
  workflow_dispatch:

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 1.0.${{ github.run_number }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Sin ANDROID_KEYSTORE_BASE64: el APK sale sin firmar."; exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/yalope.p12"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/yalope.p12" >> "$GITHUB_ENV"
      - name: Compilar
        working-directory: android
        env:
          ANDROID_KEYSTORE_CLAVE: ${{ secrets.ANDROID_KEYSTORE_CLAVE }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Ordenar los paquetes
        run: |
          mkdir -p salida
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" salida/Yalope.apk
          cp android/app/build/outputs/bundle/release/app-release.aab salida/Yalope.aab
          ls -la salida
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.VERSION_NAME }}
          path: salida/
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cap sync ios
      - name: Compilar para el simulador
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build-ios \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$VERSION_CODE" \
            MARKETING_VERSION="$VERSION_NAME" \
            build
      - name: Ordenar el paquete
        run: |
          mkdir -p salida
          ditto -c -k --keepParent build-ios/Build/Products/Release-iphonesimulator/App.app salida/Yalope-iphone-simulador.zip
          ls -la salida
      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ env.VERSION_NAME }}
          path: salida/
          if-no-files-found: error

  android-nativa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movil
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: movil/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo prebuild --platform android --no-install
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Sin ANDROID_KEYSTORE_BASE64: el APK sale con la firma de depuración."; exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/yalope.p12"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/yalope.p12" >> "$GITHUB_ENV"
      - name: Compilar
        working-directory: movil/android
        env:
          ANDROID_KEYSTORE_CLAVE: ${{ secrets.ANDROID_KEYSTORE_CLAVE }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        # Solo los procesadores de teléfonos (ARM de 64 y 32 bits): con los de emulador (x86) el
        # APK pasaba los 120 MB.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Ordenar el paquete
        run: |
          mkdir -p ../salida
          cp "$(ls android/app/build/outputs/apk/release/*.apk | head -1)" ../salida/Yalope-nativa-previa.apk
          ls -la ../salida
      - uses: actions/upload-artifact@v4
        with:
          name: android-nativa-${{ env.VERSION_NAME }}
          path: salida/
          if-no-files-found: error

  ios-nativa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: movil
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: movil/package-lock.json
      - run: npm ci
      - run: npx expo prebuild --platform ios
      - name: Compilar para el simulador
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          ESQUEMA=$(basename "$WS" .xcworkspace)
          xcodebuild             -workspace "$WS"             -scheme "$ESQUEMA"             -configuration Release             -sdk iphonesimulator             -destination "generic/platform=iOS Simulator"             -derivedDataPath build-ios             CODE_SIGNING_ALLOWED=NO             build
      - name: Ordenar el paquete
        run: |
          mkdir -p ../salida
          APP=$(ls -d build-ios/Build/Products/Release-iphonesimulator/*.app | head -1)
          ditto -c -k --keepParent "$APP" ../salida/Yalope-nativa-previa-iphone-simulador.zip
          ls -la ../salida
      - uses: actions/upload-artifact@v4
        with:
          name: ios-nativa-${{ env.VERSION_NAME }}
          path: salida/
          if-no-files-found: error

  publicar:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android, ios, android-nativa, ios-nativa]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paquetes
          merge-multiple: true
      - name: Release «apps-ultima»
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NOTAS="Versión $VERSION_NAME · commit ${GITHUB_SHA::7} · $(date -u +'%Y-%m-%d %H:%M') UTC

          - **Yalope.apk**: Android. Se baja desde el teléfono y se instala (hay que permitir «instalar apps de origen desconocido»). Se instala encima de la versión anterior.
          - **Yalope.aab**: Android para Google Play (todavía no se publica).
          - **Yalope-iphone-simulador.zip**: iPhone, solo para el simulador de Xcode (sin firma de Apple todavía).

          Estas abren yalope.com: los cambios de la web les llegan solos, sin bajar un paquete nuevo.

          **App nativa, vista previa** (se instala al lado de la de arriba; todavía tiene secciones que abren la web):
          - **Yalope-nativa-previa.apk**: Android.
          - **Yalope-nativa-previa-iphone-simulador.zip**: iPhone, para el simulador de Xcode."
          if ! gh release view apps-ultima >/dev/null 2>&1; then
            gh release create apps-ultima --prerelease --title "Apps · última versión" --notes "$NOTAS" --target "$GITHUB_SHA"
          else
            gh release edit apps-ultima --notes "$NOTAS"
          fi
          gh release upload apps-ultima paquetes/Yalope.apk paquetes/Yalope.aab paquetes/Yalope-iphone-simulador.zip paquetes/Yalope-nativa-previa.apk paquetes/Yalope-nativa-previa-iphone-simulador.zip --clobber
      - name: Resumen
        run: |
          {
            echo "### Las tres versiones"
            echo "- **Web**: yalope.com (Vercel)"
            echo "- **Android**: [Yalope.apk](https://github.com/${{ github.repository }}/releases/download/apps-ultima/Yalope.apk) · $VERSION_NAME"
            echo "- **iPhone (simulador)**: [Yalope-iphone-simulador.zip](https://github.com/${{ github.repository }}/releases/download/apps-ultima/Yalope-iphone-simulador.zip)"
            echo "- **App nativa (vista previa)**: [Android](https://github.com/${{ github.repository }}/releases/download/apps-ultima/Yalope-nativa-previa.apk) · [iPhone simulador](https://github.com/${{ github.repository }}/releases/download/apps-ultima/Yalope-nativa-previa-iphone-simulador.zip)"
          } >> "$GITHUB_STEP_SUMMARY"
