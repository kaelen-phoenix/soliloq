name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Tests unitarios de la lógica pura (#355).
      - run: npm test

      - name: build
        run: npm run build
        env:
          # Valores dummy: alcanza para que `next build` no falle al instanciar los
          # clientes de Supabase (usan `new URL(...)`, que tira si falta la variable).
          # El build de Vercel usa las variables reales configuradas ahí.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ci-placeholder-maps-key

      # E2E de las superficies públicas (landing, /ingresar, robots/sitemap/manifest).
      # Corren contra la app buildeada con variables dummy — sin backend. Los flujos con
      # sesión (`e2e/flujos/`) se saltean solos.
      - run: npx playwright install --with-deps chromium
      - name: e2e público
        run: npx playwright test e2e/publico.spec.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ci-placeholder-maps-key

  # Tests SQL contra la base (begin/rollback, no dejan rastro). Toda la lógica va en bash
  # para no depender de expresiones frágiles: si no está el secret o no cambió nada de
  # `supabase/`, el job termina OK sin correr nada.
  db-tests:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # #353: los tipos de la base se generan de Supabase. Si alguien aplica una migración y no
      # regenera `database.generated.ts` (o al revés), falla acá. Corre siempre: es un fetch.
      - name: Tipos de la base al día
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Sin secret SUPABASE_ACCESS_TOKEN — se saltea."; exit 0
          fi
          node scripts/tipos-db.mjs --verificar
      - name: Tests SQL
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Sin secret SUPABASE_ACCESS_TOKEN — se saltea."; exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$BASE" ] && ! git diff --name-only "$BASE" HEAD | grep -q '^supabase/'; then
            echo "Sin cambios en supabase/ — nada que testear."; exit 0
          fi
          bash supabase/tests/run.sh

  # Circuito de match por UI (swipe → placa → aviso de match → Call Back → convocar →
  # /convocatoria → sala) contra el proyecto de staging (nunca prod). Igual que db-tests: si
  # no están los secrets (p.ej. un PR desde un fork, que no los recibe) el job termina OK sin
  # correr nada — ver e2e/README.md.
  e2e-flujos:
    runs-on: ubuntu-latest
    # Un solo run a la vez contra staging (plan free): con varios PRs en paralelo los flujos
    # se pisaban en tiempos de respuesta y fallaban por timeout. Los demás esperan su turno
    # (GitHub deja uno solo en espera: si se encola un tercero, el que esperaba se cancela y
    # hay que volver a correrlo).
    concurrency:
      group: e2e-staging
      cancel-in-progress: false
    env:
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      E2E_SERVICE_KEY: ${{ secrets.E2E_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: env.E2E_SUPABASE_URL != ''
        with:
          # 22, no 20 como el resto del workflow: el cliente admin de supabase-js (usado acá
          # para sembrar/limpiar usuarios de prueba) instancia un WebSocket nativo al crear
          # el client, y Node 20 no lo tiene ("Node.js detected but native WebSocket not
          # found").
          node-version: 22
          cache: npm

      - run: npm ci
        if: env.E2E_SUPABASE_URL != ''

      - name: build contra staging
        if: env.E2E_SUPABASE_URL != ''
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.E2E_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3100
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ci-placeholder-maps-key

      - run: npx playwright install --with-deps chromium
        if: env.E2E_SUPABASE_URL != ''

      - name: levantar la app contra staging
        if: env.E2E_SUPABASE_URL != ''
        # La clave de servicio del server (borrar cuenta, admin): sin ella esos flujos fallan
        # (#229). Es la de staging, la misma que usan los tests para sembrar.
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.E2E_SERVICE_KEY }}
        run: |
          npm run start -- --port 3100 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3100/bienvenida > /dev/null && exit 0
            sleep 1
          done
          echo "El server no levantó a tiempo" >&2
          exit 1

      - name: e2e flujos (staging)
        if: env.E2E_SUPABASE_URL != ''
        run: npx playwright test e2e/flujos
        env:
          E2E_BASE_URL: http://localhost:3100

      # #356: los que antes se corrían solo a mano. Accesibilidad (axe en cada pantalla),
      # formularios que no se salgan en 320–414 px, y todos los formularios enviados de verdad.
      # Usan la misma app y el mismo staging; los informes quedan como artefacto.
      - name: e2e accesibilidad y formularios (staging)
        if: env.E2E_SUPABASE_URL != ''
        run: npx playwright test e2e/local/accesibilidad.spec.ts e2e/local/formularios-ancho.spec.ts e2e/local/todos-los-formularios.spec.ts
        env:
          E2E_BASE_URL: http://localhost:3100
          E2E_A11Y: "1"
          E2E_FORMULARIOS: "1"
          E2E_FORMULARIOS_TODOS: "1"
          E2E_RECORRIDO_DIR: informes-e2e

      - name: subir informes
        if: always() && env.E2E_SUPABASE_URL != ''
        uses: actions/upload-artifact@v4
        with:
          name: informes-e2e
          path: |
            informes-e2e/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Sin secrets de staging — se saltea
        if: env.E2E_SUPABASE_URL == ''
        run: echo "Sin E2E_SUPABASE_URL/E2E_SUPABASE_ANON_KEY/E2E_SERVICE_KEY — se saltea (normal en un PR desde un fork, que no recibe secrets)."
