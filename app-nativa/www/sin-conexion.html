<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yalope</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c0a0b; color: #f5f0ee; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; box-sizing: border-box; text-align: center; }
  h1 { margin: 0; font-size: 22px; }
  p { margin: 0; max-width: 320px; color: #b9aeaa; line-height: 1.5; }
  button { margin-top: 12px; border: 0; border-radius: 999px; padding: 12px 24px; font-size: 16px; font-weight: 600; color: #fff; background: linear-gradient(135deg, #d4430f, #b3260a); }
</style>
</head>
<body>
<main>
  <h1 id="titulo">Sin conexión</h1>
  <p id="texto">Yalope necesita internet. Revisá tu conexión y probá de nuevo.</p>
  <button id="reintentar" type="button" onclick="location.href='https://yalope.com/'">Reintentar</button>
</main>
<script>
  if (!/^es\b/i.test(navigator.language || "")) {
    document.documentElement.lang = "en";
    document.getElementById("titulo").textContent = "You're offline";
    document.getElementById("texto").textContent = "Yalope needs an internet connection. Check your connection and try again.";
    document.getElementById("reintentar").textContent = "Try again";
  }
</script>
</body>
</html>
